version: '3.8'

services:
  # ── MongoDB Database ──────────────────────────────────────
  mongodb:
    image: mongo:latest
    container_name: hiremind-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=hiremind_ai

  # ── Ollama Local AI LLM Engine ────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: hiremind-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # ── MinIO S3 Object & File Storage ────────────────────────
  minio:
    image: minio/minio:latest
    container_name: hiremind-minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # MinIO S3 API
      - "9001:9001"   # MinIO Web Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

volumes:
  mongodb_data:
    driver: local
  ollama_data:
    driver: local
  minio_data:
    driver: local
