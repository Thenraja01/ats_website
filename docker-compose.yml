services:
  # ── Ollama Local AI LLM Engine ────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: hiremind-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # ── MinIO S3 Object & File Storage ────────────────────────
  minio:
    image: minio/minio:latest
    container_name: hiremind-minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # MinIO S3 API
      - "9001:9001"   # MinIO Web Console UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  # ── Redis (Celery Broker & Cache) ─────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hiremind-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  ollama_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local


